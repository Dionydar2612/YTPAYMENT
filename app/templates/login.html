{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>💸 ค่าใช้จ่ายกลุ่ม</h1>
    <p class="muted">เข้าสู่ระบบเพื่อจัดการค่าใช้จ่ายและการชำระเงิน</p>
    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" required autocomplete="username">
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <div id="loginError" class="error-text"></div>
      <button type="submit" class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  try {
    const res = await apiFetch('/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    window.location.href = '/dashboard';
  } catch (err) {
    errBox.textContent = err.message || 'เข้าสู่ระบบไม่สำเร็จ';
  }
});
</script>
{% endblock %}
